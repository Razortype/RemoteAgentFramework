events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:8080 http://localhost:8080;" always;
    
    # Educational safety: Restrict to localhost
    allow 127.0.0.1;
    allow ::1;
    deny all;
    
    server {
        listen 3000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        
        # Educational framework identification
        add_header X-Educational-Framework "RemoteAgentFramework-v1.0.0" always;
        add_header X-Educational-Warning "FOR EDUCATIONAL USE ONLY - VM ISOLATION REQUIRED" always;
        
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # API proxy to backend (localhost only)
        location /api/ {
            proxy_pass http://localhost:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # WebSocket proxy (localhost only)
        location /ws/ {
            proxy_pass http://localhost:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Security: Deny access to sensitive files
        location ~ /\. {
            deny all;
        }
        
        location ~ \.(env|log|config)$ {
            deny all;
        }
    }
}